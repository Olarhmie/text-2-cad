<!DOCTYPE html>
<html>
<head>
    <title>3D Mesh Viewer</title>
    <style>
        body { margin: 0; }
        #viewer { width: 100%; height: 100vh; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/PLYLoader.js"></script>
</head>
<body>
    <div id="viewer"></div>
    <script>
        // Initialize scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);
        
        // Setup camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.z = 2;
        
        // Setup renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('viewer').appendChild(renderer.domElement);
        
        // Add lights
        const light1 = new THREE.DirectionalLight(0xffffff, 1);
        light1.position.set(1, 1, 1);
        scene.add(light1);
        scene.add(new THREE.AmbientLight(0x404040));
        
        // Load and display the mesh  alot of modification for the dist here
        
        new THREE.PLYLoader().load(
            `/static/mesh/{{ filename }}.ply`,
            (geometry) => {
                const material = new THREE.MeshStandardMaterial({ 
                    color: 0x0077ff,
                    flatShading: true 
                });
                const mesh = new THREE.Mesh(geometry, material);
                scene.add(mesh);
                
                // Auto-center the mesh
                const bbox = new THREE.Box3().setFromObject(mesh);
                const center = bbox.getCenter(new THREE.Vector3());
                mesh.position.sub(center);
                
                // Add orbit controls
                new THREE.OrbitControls(camera, renderer.domElement);
                
                // Animation loop
                function animate() {
                    requestAnimationFrame(animate);
                    renderer.render(scene, camera);
                }
                animate();

                
                 // Temporary: Mock distance values (replace with real data from Flask)
                const mockDistances = new Array(geometry.attributes.position.count).fill(0).map(
                    (_,i) => minDist + (maxDist-minDist)*Math.random()
                );
        
                // Color mapping (viridis-like)
                for (let i = 0; i < mockDistances.length; i++) {
                    const t = (mockDistances[i] - minDist) / (maxDist - minDist);
                    const color = new THREE.Color(
                        Math.max(0, Math.min(1, 0.5 * Math.sin(2 * t * Math.PI - Math.PI/2) + 0.5)),
                        Math.max(0, Math.min(1, t)),
                        Math.max(0, Math.min(1, 0.5 * -Math.sin(2 * t * Math.PI) + 0.5))
                    );
                    colors.push(color.r, color.g, color.b);
                }
        
                // Apply colors to geometry
                geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        
                // 2. Create material with vertex colors enabled
                    material = new THREE.MeshStandardMaterial({
                        vertexColors: true,
                        side: THREE.DoubleSide,
                        roughness: 0.3,
                        metalness: 0.1
                });
        
                // 3. Add mesh to scene
                    mesh = new THREE.Mesh(geometry, material);
                    scene.add(mesh);
        
                // 4. Add legend (optional)
                addDistanceLegend(minDist, maxDist);
            },
            undefined,
            (error) => console.error("Mesh load error:", error)
        );


        //added this helper: add color scale legen
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
